name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - run: vp run check

      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-all-errors https://soe.stoff.dev > agent.sh
          timeout 60 sh agent.sh > agent.log 2>&1 &
          for attempt in $(seq 1 20); do
            code=$(sed -n 's/^Session: \([a-z0-9]*\).*/\1/p' agent.log)
            [ -n "$code" ] && break
            sleep 1
          done
          test "$(curl -fsS "https://soe.stoff.dev/$code" -d 'printf soe-smoke')" = "soe-smoke"
          curl -fsS -X DELETE "https://soe.stoff.dev/$code"
          wait
