name = "reach"
main = "src/worker.ts"
compatibility_date = "2026-10-12"
account_id = "628c0e516646e33b3f22f2e8741bf0a5"
workers_dev = false
upload_source_maps = true
compliance_region = "public"

routes = [{ pattern = "reach.stoff.dev", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = true
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 0.1
persist = false

[placement]
mode = "smart"

[triggers]
crons = []

[[durable_objects.bindings]]
name = "COMMAND_BRIDGES"
class_name = "CommandBridge"

[[migrations]]
tag = "v1-command-bridge"
new_sqlite_classes = ["CommandBridge"]

[[ratelimits]]
name = "LOOKUPS"
namespace_id = "2001"
simple = { limit = 300, period = 60 }
